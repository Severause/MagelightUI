<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Magelight C++ Panel</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent;
    font-family: "Segoe UI", system-ui, sans-serif; color: #e8e2d4; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .card { background: #1f1913; border: 1px solid rgba(201,164,92,0.4); border-radius: 8px;
    padding: 28px 34px; text-align: center; box-shadow: 0 18px 56px rgba(0,0,0,0.6); }
  .num { font-size: 52px; font-weight: 700; color: #c9a45c; margin: 6px 0 14px; }
  button { font: inherit; padding: 8px 18px; color: #e8e2d4; background: #131009;
    border: 1px solid rgba(201,164,92,0.5); border-radius: 5px; cursor: pointer; }
  button:hover { border-color: #c9a45c; }
  .hint { margin-top: 12px; font-size: 12px; color: #948871; }
</style>
</head>
<body>
  <div id="wrap"><div class="card">
    <div>the plugin sent</div>
    <div class="num" id="num">—</div>
    <button id="btn">ask for another</button>
    <div class="hint">Escape closes · this whole page is views/panel/index.html</div>
  </div></div>

<script>
  // The host installs window.magelight on every page: .send(name, arg) posts to
  // the plugin's RegisterJSListenerEx; .on(name, fn) receives InvokeJS/EvalJS.
  // The plugin also calls window.setNumber() directly via InvokeJS.
  window.setNumber = function (n) {
    document.getElementById('num').textContent = n;
  };
  document.getElementById('btn').addEventListener('click', function () {
    if (window.magelight && window.magelight.send) {
      window.magelight.send('panelClick', 'button');   // -> OnPanelClick in the plugin
    }
  });
</script>
</body>
</html>

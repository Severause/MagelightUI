<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#14110d;overflow:hidden}
#grid{padding:8px;width:1600px}
#grid img{width:128px;height:128px;margin:4px;display:inline-block;vertical-align:top}
</style></head><body><div id="grid"></div>
<script>
// One 256 px picture drawn 100 times at 128 px, every one redrawn each frame (the grid moves by a pixel).
var cv=document.createElement('canvas');cv.width=cv.height=256;var x=cv.getContext('2d');
for(var i=0;i<64;i++){x.fillStyle='hsl('+(i*37%360)+',60%,'+(30+i%5*10)+'%)';x.fillRect((i%8)*32,(i>>3)*32,32,32)}
x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(128,128,90,0,6.283);x.stroke();
var url=cv.toDataURL('image/png'),g=document.getElementById('grid');
for(var k=0;k<100;k++){var im=new Image();im.src=url;g.appendChild(im)}
window.__bench=function(n){g.style.paddingLeft=(8+n%2)+'px'};
</script></body></html>
